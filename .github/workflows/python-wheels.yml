# Builds the `fin-primitives` Python wheels (abi3, CPython 3.9+) and publishes them to PyPI.
#
# Runs on tags named py-v* (for example py-v2.16.0) and by hand (workflow_dispatch builds and
# tests without publishing). The publish job needs every wheel job to pass, so run it by hand
# on a branch first (Actions > Python wheels > Run workflow) and push the tag only once that
# run is green. Publishing uses PyPI trusted publishing: no token is stored here.
# One-time setup on pypi.org, under the project's (or your account's pending) publishers:
#   owner: Mattbusel, repository: fin-primitives, workflow: python-wheels.yml, environment: pypi
#
# Besides the five native wheels it builds a WebAssembly wheel for Pyodide (PEP 783 platform
# tag pyemscripten_2026_0_wasm32, Python 3.14), so `micropip.install("fin-primitives")` works
# in JupyterLite, marimo WASM notebooks, PyScript and Stlite. The wheel is tested inside
# Pyodide (Node) before upload. To add that wheel to a release that is already on PyPI, run
# the workflow by hand on main with "publish-pyemscripten" ticked: it uploads only the
# pyemscripten wheel, and only if the wheel's sources are unchanged since the py-v<version> tag.
name: Python wheels

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:
    inputs:
      publish-pyemscripten:
        description: "Upload the pyemscripten wheel to the existing PyPI release of this version"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    name: wheel ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # floor: the oldest CPython the wheel is tested on. The abi3 floor is 3.9; it is
        # tested on the x86_64 runners. CPython 3.9 is past end of life and setup-python may
        # have no arm64 build of it, so the arm64 runners test 3.10 instead.
        include:
          - { os: linux, runner: ubuntu-24.04, target: x86_64, test: true, floor: "3.9" }
          - { os: linux, runner: ubuntu-24.04-arm, target: aarch64, test: true, floor: "3.10" }
          # Intel macOS runners are being retired: cross-compile x86_64 on Apple Silicon
          # (the wheel is built and uploaded; its tests run only on native targets).
          - { os: macos, runner: macos-15, target: x86_64, test: false, floor: "3.10" }
          - { os: macos, runner: macos-15, target: aarch64, test: true, floor: "3.10" }
          - { os: windows, runner: windows-latest, target: x64, test: true, floor: "3.9" }
          # musllinux (Alpine and other musl images). The runner's CPython is glibc, so these
          # are smoke-tested inside a python:3.12-alpine container instead.
          - { os: musllinux, runner: ubuntu-24.04, target: x86_64, test: false, floor: "3.9", manylinux: musllinux_1_2 }
          - { os: musllinux, runner: ubuntu-24.04-arm, target: aarch64, test: false, floor: "3.10", manylinux: musllinux_1_2 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.os == 'windows' && 'x64' || null }}
      - name: Check the indicator catalogue and fin_primitives.ta are up to date
        run: |
          python python/tools/gen_registry.py --check
          python python/tools/gen_ta.py --check
      - name: Check the wheel's license file matches the repository's
        shell: bash
        run: cmp LICENSE python/LICENSE
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          # No --release: pyproject.toml selects the crate's release-python profile
          # (optimised, panics unwind into Python exceptions).
          args: --out dist
          manylinux: ${{ matrix.manylinux || (matrix.os == 'linux' && 'auto') || null }}
          sccache: "true"
      - name: Smoke-test the musllinux wheel in Alpine
        if: matrix.os == 'musllinux'
        run: |
          docker run --rm -v "$PWD/python/dist:/dist" python:3.12-alpine sh -c '
            pip install --no-index --find-links /dist fin-primitives &&
            python -c "
          import fin_primitives as fp
          closes = [44.34, 44.09, 44.15, 43.61, 44.33, 44.83, 45.10, 45.42, 45.84, 46.08, 45.89, 46.03, 45.61, 46.28, 46.28, 46.00]
          last = fp.rsi(closes, 14)[-1]
          assert round(float(last), 2) == 66.25, last
          print(fp.__version__, last)
          "'
      - name: Test the wheel on CPython ${{ matrix.floor }} (oldest tested)
        if: matrix.test
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.floor }}
      - name: Install and run the tests (${{ matrix.floor }})
        if: matrix.test
        shell: bash
        run: |
          python -m venv .venvfloor
          if [ -f .venvfloor/Scripts/python.exe ]; then PY=.venvfloor/Scripts/python.exe; else PY=.venvfloor/bin/python; fi
          $PY -m pip install --upgrade pip
          $PY -m pip install pytest numpy pandas
          $PY -m pip install --no-index --find-links python/dist fin-primitives
          cd python && ../$PY -m pytest -q
      - name: Test the wheel on CPython 3.13
        if: matrix.test
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install and run the tests (3.13, with polars and pandas-ta-classic)
        if: matrix.test
        shell: bash
        run: |
          python -m venv .venv313
          if [ -f .venv313/Scripts/python.exe ]; then PY=.venv313/Scripts/python.exe; else PY=.venv313/bin/python; fi
          $PY -m pip install --upgrade pip
          # pandas-ta-classic: the reference tests/test_fast.py checks fin_primitives.fast against
          $PY -m pip install pytest numpy pandas polars "pandas-ta-classic==0.9.0"
          $PY -m pip install --no-index --find-links python/dist fin-primitives
          cd python && ../$PY -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: python/dist/*.whl
          if-no-files-found: error

  wheel-pyemscripten:
    name: wheel pyemscripten wasm32 (Pyodide ${{ matrix.pyodide }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Pyodide 314.x is Python 3.14 and the pyemscripten_2026_0 platform. pyodide-build
        # reads the Rust toolchain, Emscripten version, ABI version and rustflags from it.
        include:
          - { python: "3.14", pyodide: "314.0.7" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pyodide-build and the Pyodide cross-build environment
        run: |
          python -m pip install "pyodide-build==0.39.3"
          pyodide xbuildenv install ${{ matrix.pyodide }}
      - name: Read the Pyodide platform config
        id: pyodide
        run: |
          {
            echo "rust-toolchain=$(pyodide config get rust_toolchain)"
            echo "emscripten-version=$(pyodide config get emscripten_version)"
            echo "abi-version=$(pyodide config get pyodide_abi_version)"
            echo "rustflags=$(pyodide config get rustflags)"
          } >> "$GITHUB_OUTPUT"
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ steps.pyodide.outputs.emscripten-version }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUSTFLAGS: ${{ steps.pyodide.outputs.rustflags }}
          MATURIN_PYEMSCRIPTEN_PLATFORM_VERSION: ${{ steps.pyodide.outputs.abi-version }}
        with:
          working-directory: python
          maturin-version: v1.16.0
          target: wasm32-unknown-emscripten
          rust-toolchain: ${{ steps.pyodide.outputs.rust-toolchain }}
          args: --out dist --interpreter ${{ matrix.python }}
      - name: Check the wheel's platform tag and license file
        run: |
          ls -l python/dist
          test "$(ls python/dist/*-pyemscripten_${{ steps.pyodide.outputs.abi-version }}_wasm32.whl | wc -l)" -eq 1
          unzip -l python/dist/*.whl | grep -q "dist-info/licenses/LICENSE"
      - name: Install into Pyodide (Node) and run the tests
        run: |
          pyodide venv .venv-pyodide
          . .venv-pyodide/bin/activate
          pip install pytest numpy pandas
          pip install --no-index --find-links python/dist fin-primitives
          cd python && python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-pyemscripten-wasm32
          path: python/dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: [wheels, wheel-pyemscripten, sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/fin-primitives/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Tag matches the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          VERSION="${TAG#py-v}"
          test "$(ls dist/*.whl | wc -l)" -eq 8 || { echo "expected 8 wheels (5 manylinux/macOS/Windows, 2 musllinux, 1 pyemscripten)"; exit 1; }
          for f in dist/*.whl; do
            unzip -l "$f" | grep -q "dist-info/licenses/LICENSE" || { echo "$f has no LICENSE"; exit 1; }
          done
          for f in dist/*; do
            case "$(basename "$f")" in
              fin_primitives-"$VERSION"-*|fin_primitives-"$VERSION".tar.gz) ;;
              *) echo "$f does not match tag $TAG (version in Cargo.toml?)"; exit 1 ;;
            esac
          done
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # PEP 740 provenance attestations, signed with this workflow's OIDC identity
          # (the action's default under trusted publishing; stated here so it stays on).
          attestations: true

  publish-pyemscripten:
    # Adds the pyemscripten wheel to a release that is already on PyPI (for a release made
    # before this job existed). Run by hand on main with publish-pyemscripten ticked.
    name: Publish the pyemscripten wheel to an existing PyPI release
    if: github.event_name == 'workflow_dispatch' && inputs.publish-pyemscripten && github.ref == 'refs/heads/main'
    needs: [wheel-pyemscripten]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/fin-primitives/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: wheel-pyemscripten-wasm32
          path: dist
      - name: Only backfill a released version built from unchanged sources
        run: |
          ls -l dist
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$(ls dist/*.whl | wc -l)" -eq 1
          case "$(basename dist/*.whl)" in
            fin_primitives-"$VERSION"-*-pyemscripten_*_wasm32.whl) ;;
            *) echo "unexpected wheel name for $VERSION"; exit 1 ;;
          esac
          curl -fsS "https://pypi.org/pypi/fin-primitives/$VERSION/json" > /dev/null \
            || { echo "$VERSION is not on PyPI: release it with a py-v$VERSION tag instead"; exit 1; }
          git diff --quiet "py-v$VERSION" HEAD -- src Cargo.toml Cargo.lock python/src python/pyproject.toml python/LICENSE \
            || { echo "wheel sources changed since py-v$VERSION: make a new release instead"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # PEP 740 provenance attestations, signed with this workflow's OIDC identity
          # (the action's default under trusted publishing; stated here so it stays on).
          attestations: true
          skip-existing: true
