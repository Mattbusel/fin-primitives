# OpenSSF Scorecard: checks this repository's supply-chain practices (branch protection,
# pinned dependencies, token permissions, signed releases and more) and publishes the result
# to https://scorecard.dev/viewer/?uri=github.com/Mattbusel/fin-primitives and to the
# Security tab's code scanning alerts. https://github.com/ossf/scorecard-action
#
# With publish_results the Scorecard API only accepts runs from a workflow with no top-level
# env or write permissions, and only approved actions in the analysis job, so keep it lean.
name: Scorecard supply-chain security

on:
  # Only the default branch is supported.
  push:
    branches: [main]
  # Rerun when branch protection settings change (feeds the Branch-Protection check).
  branch_protection_rule:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # OIDC token to publish the results to the Scorecard API (publish_results).
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
