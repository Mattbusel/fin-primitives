[package]
name = "fin-primitives"
version = "3.2.0"
edition = "2021"
rust-version = "1.81"
description = "Checked building blocks for Rust trading code: exact decimal price and quantity types, a level-2 order book, ticks to OHLCV candles, 700+ streaming indicators, Black-Scholes Greeks, a position ledger and risk limits."
authors = ["Matt Busel <matt@busel.dev>"]
repository = "https://github.com/Mattbusel/fin-primitives"
homepage = "https://fin-primitives.vercel.app/"
documentation = "https://docs.rs/fin-primitives"
readme = "README.md"
license = "MIT"
keywords = ["finance", "trading", "orderbook", "technical-analysis", "quant"]
categories = ["finance", "mathematics", "data-structures"]
include = ["src/**/*", "benches/**/*", "tests/**/*", "examples/**/*", "Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md"]

[features]
# Everything except the Tokio runtime is on by default. For only the core types
# (Price, Quantity, Symbol, Tick, OrderBook, OHLCV, the Signal trait and the normal
# distribution) use `default-features = false`.
default = ["serde", "indicators", "options", "portfolio", "risk", "fixed-income", "derivatives", "crypto", "credit", "ml", "backtest", "tax", "yield-curve", "clustering", "montecarlo"]
## Every domain module plus `async` and `ta-compat` (not the interop crates or `python`).
full = ["serde", "indicators", "options", "portfolio", "risk", "fixed-income", "derivatives", "crypto", "credit", "ml", "backtest", "tax", "yield-curve", "clustering", "montecarlo", "async", "ta-compat"]
## Serialize and Deserialize for the data types (prices as exact decimal strings).
serde = ["dep:serde", "rust_decimal/serde-with-str", "chrono/serde"]
## `signals::indicators` (700+ streaming indicators), `technical`, `regime`, `correlation`, `volatility`.
indicators = []
## `greeks` (Black-Scholes, Greeks, implied volatility) and `options` (chains, spreads, exotics).
options = []
## `portfolio`, `position`, `pnl`, `attribution`, `factor`, `rebalancing`, `performance`.
portfolio = []
## `risk`, `scenario`, `cross_asset`, `liquidity`.
risk = ["portfolio"]
## `fixed_income`: bonds, duration, convexity, swap curves.
fixed-income = []
## `derivatives`: swaps, forwards, futures.
derivatives = []
## `crypto`, `funding` and `arbitrage`: perpetual funding rates, DeFi maths, cross-venue arbitrage.
crypto = []
## `credit`: CDS pricing and hazard curves.
credit = []
## `ml`, `ml_features`, `alternative_data`, `pairs_trading`, `events`: statistical models.
ml = []
## `backtest`, `execution`, `execution_cost`, `impact`, `latency`, `microstructure`.
backtest = ["portfolio"]
## `tax`: tax lots and realized gains.
tax = []
## `yield_curve`: yield curve construction and interpolation.
yield-curve = []
## `clustering`: k-means and correlation clustering.
clustering = []
## `montecarlo`: Monte Carlo path simulation.
montecarlo = []
## `async_signals`: a Tokio task that runs a signal pipeline over a channel of bars. Off by default since 3.0.
async = ["dep:tokio"]
## `ta_compat`: a drop-in replacement for the `ta` crate's API (same traits and indicator names), computed with Wilder / TA-Lib-exact maths. No extra dependencies.
ta-compat = ["indicators"]
## Interop: fin-primitives bars implement `ta`'s Open/High/Low/Close/Volume traits.
ta = ["dep:ta"]
## Interop: fin-primitives bars implement `yata`'s OHLCV trait.
yata = ["dep:yata"]
## Interop: conversions to and from `wickra-core` candles (needs Rust 1.86+).
wickra = ["dep:wickra-core"]
## Arrow `RecordBatch` export and import for bars, with exact Decimal128 columns (needs Rust 1.88+).
arrow = ["dep:arrow-array", "dep:arrow-schema"]
## PyO3 bindings for the `fin-primitives` Python package; build the wheel from `python/` with `maturin build` (not `--release`, which picks the panic = "abort" profile; needs Rust 1.83+).
python = ["dep:pyo3", "indicators"]

[package.metadata.docs.rs]
# Every domain module plus `async`. `python` is left out: it needs a Python interpreter at build time.
features = ["full"]
rustdoc-args = ["--cfg", "docsrs"]
# Scrape the examples so docs.rs shows real call sites next to the APIs they use.
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[dependencies]
# serde: serialization framework (optional, `serde` feature, on by default)
serde = { version = "1", features = ["derive", "rc"], optional = true }
# chrono: datetime handling
chrono = { version = "0.4.35", default-features = false, features = ["std", "clock"] }
# rust_decimal: exact decimal arithmetic for financial values; never use f64 for prices
rust_decimal = { version = "1.36", default-features = false, features = ["std"] }
# thiserror: error derive
thiserror = "2"
# pyo3: Python bindings, only when the `python` feature is enabled
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
# libm: erfc for the standard normal CDF (about 1e-15 relative error, also in the tails)
libm = "0.2.11"
# Interop with other trading crates, each optional and off by default.
ta = { version = "0.5", optional = true, default-features = false }
yata = { version = "0.7", optional = true, default-features = false }
wickra-core = { version = "1", optional = true, default-features = false }
arrow-array = { version = "60", optional = true, default-features = false }
arrow-schema = { version = "60", optional = true, default-features = false }
# tokio: runtime for the async_signals pipeline (optional, `async` feature, off by default)
tokio = { version = "1.40", features = ["rt", "sync"], optional = true }

# On wasm32-unknown-unknown the clock comes from JavaScript (`Date.now`), so
# `NanoTimestamp::now()` works in the browser instead of panicking.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
chrono = { version = "0.4.35", default-features = false, features = ["wasmbind"] }

[dev-dependencies]
# rust_decimal_macros: dec!() literals in tests, examples and doc examples
rust_decimal_macros = "1"
# proptest: property-based testing, required for algorithmic correctness guarantees
proptest = "1"
tokio = { version = "1.40", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["async_tokio"] }
serde_json = "1"

[[bench]]
name = "tick_bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

# Used by the Python wheel (python/pyproject.toml): like release, but a panic unwinds
# into a Python exception instead of aborting the interpreter.
[profile.release-python]
inherits = "release"
panic = "unwind"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

[lints.clippy]
# Correctness
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
# Index loops read better than iterator chains in the matrix and window maths here.
needless_range_loop = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
# `x.max(lo).min(hi)` maps NaN to a bound; `clamp` would let NaN through. Keep the former.
manual_clamp = "allow"
# `SignalExpr::add`, `SignalValue::mul` etc. are builder methods with non-operator signatures.
should_implement_trait = "allow"
# Style
pedantic = { level = "allow", priority = -1 }
# Allow common false-positive pedantic lints
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Suppress remaining pedantic violations
similar_names = "allow"
redundant_closure_for_method_calls = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
needless_pass_by_value = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
option_if_let_else = "allow"
single_match_else = "allow"
items_after_statements = "allow"
match_wildcard_for_single_variants = "allow"
wildcard_imports = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
semicolon_if_nothing_returned = "allow"
if_not_else = "allow"
explicit_iter_loop = "allow"
manual_let_else = "allow"

# Examples and tests that use a feature-gated module are skipped (not failed) when
# that feature is off, so `cargo test --no-default-features` runs the core suite.
[[example]]
name = "with_ta"
required-features = ["ta", "indicators"]

[[example]]
name = "candles"
required-features = ["indicators"]

[[example]]
name = "option_chain"
required-features = ["options"]

[[example]]
name = "position_risk"
required-features = ["risk"]

[[example]]
name = "value_at_risk"
required-features = ["risk"]

[[test]]
name = "api_coverage"
required-features = ["risk"]

[[test]]
name = "edge_cases"
required-features = ["indicators", "portfolio"]

[[test]]
name = "indicator_accuracy"
required-features = ["indicators"]

[[test]]
name = "position_lifecycle"
required-features = ["portfolio"]

[[test]]
name = "position_risk_integration"
required-features = ["risk"]

[[test]]
name = "property_math_book"
required-features = ["options"]

[[test]]
name = "property_tests"
required-features = ["indicators", "risk"]

[[test]]
name = "risk_monitor"
required-features = ["risk"]

[[test]]
name = "signal_pipeline"
required-features = ["indicators"]
