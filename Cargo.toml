[package]
name = "fin-primitives"
version = "2.15.0"
edition = "2021"
rust-version = "1.81"
description = "Checked building blocks for Rust trading code: exact decimal price and quantity types, a level-2 order book, ticks to OHLCV candles, 700+ streaming indicators, Black-Scholes Greeks, a position ledger and risk limits."
authors = ["Matt Busel <matt@busel.dev>"]
repository = "https://gitlab.com/mattbusel/fin-primitives"
homepage = "https://fin-primitives.vercel.app/"
documentation = "https://docs.rs/fin-primitives"
readme = "README.md"
license = "MIT"
keywords = ["finance", "trading", "orderbook", "technical-analysis", "quant"]
categories = ["finance", "mathematics", "data-structures"]
include = ["src/**/*", "benches/**/*", "tests/**/*", "examples/**/*", "Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md"]

[features]
default = ["serde", "async"]
## Serialize and Deserialize for the data types (prices as exact decimal strings).
serde = ["dep:serde", "rust_decimal/serde-with-str", "chrono/serde"]
## `async_signals`: a Tokio task that runs a signal pipeline over a channel of bars.
async = ["dep:tokio"]
## Interop: fin-primitives bars implement `ta`'s Open/High/Low/Close/Volume traits.
ta = ["dep:ta"]
## Interop: fin-primitives bars implement `yata`'s OHLCV trait.
yata = ["dep:yata"]
## Interop: conversions to and from `wickra-core` candles (needs Rust 1.86+).
wickra = ["dep:wickra-core"]
## Arrow `RecordBatch` export and import for bars, with exact Decimal128 columns (needs Rust 1.88+).
arrow = ["dep:arrow-array", "dep:arrow-schema"]
## PyO3 bindings; build the wheel with `maturin develop --features python` (needs Rust 1.83+).
python = ["dep:pyo3"]

[package.metadata.docs.rs]
# Default features (serde, async). `python` is left out: it needs a Python interpreter at build time.
features = ["serde", "async"]
rustdoc-args = ["--cfg", "docsrs"]
# Scrape the examples so docs.rs shows real call sites next to the APIs they use.
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[dependencies]
# serde: serialization framework (optional, `serde` feature, on by default)
serde = { version = "1", features = ["derive", "rc"], optional = true }
# chrono: datetime handling
chrono = { version = "0.4.35", default-features = false, features = ["std", "clock"] }
# rust_decimal: exact decimal arithmetic for financial values; never use f64 for prices
rust_decimal = { version = "1.36", default-features = false, features = ["std"] }
# thiserror: error derive
thiserror = "2"
# pyo3: Python bindings, only when the `python` feature is enabled
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
# libm: erfc for the standard normal CDF (about 1e-15 relative error, also in the tails)
libm = "0.2.11"
# statrs: inverse error function for the normal quantile (VaR z-scores)
statrs = { version = "0.18", default-features = false }
# Interop with other trading crates, each optional and off by default.
ta = { version = "0.5", optional = true, default-features = false }
yata = { version = "0.7", optional = true, default-features = false }
wickra-core = { version = "1", optional = true, default-features = false }
arrow-array = { version = "60", optional = true, default-features = false }
arrow-schema = { version = "60", optional = true, default-features = false }
# tokio: runtime for the async_signals pipeline (optional, `async` feature, on by default)
tokio = { version = "1.40", features = ["rt", "sync"], optional = true }

# On wasm32-unknown-unknown the clock comes from JavaScript (`Date.now`), so
# `NanoTimestamp::now()` works in the browser instead of panicking.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
chrono = { version = "0.4.35", default-features = false, features = ["wasmbind"] }

[dev-dependencies]
# rust_decimal_macros: dec!() literals in tests, examples and doc examples
rust_decimal_macros = "1"
# proptest: property-based testing, required for algorithmic correctness guarantees
proptest = "1"
tokio = { version = "1.40", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["async_tokio"] }
serde_json = "1"

[[bench]]
name = "tick_bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

[lints.clippy]
# Correctness
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
# Index loops read better than iterator chains in the matrix and window maths here.
needless_range_loop = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
# `x.max(lo).min(hi)` maps NaN to a bound; `clamp` would let NaN through. Keep the former.
manual_clamp = "allow"
# `SignalExpr::add`, `SignalValue::mul` etc. are builder methods with non-operator signatures.
should_implement_trait = "allow"
# Style
pedantic = { level = "allow", priority = -1 }
# Allow common false-positive pedantic lints
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Suppress remaining pedantic violations
similar_names = "allow"
redundant_closure_for_method_calls = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
needless_pass_by_value = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
option_if_let_else = "allow"
single_match_else = "allow"
items_after_statements = "allow"
match_wildcard_for_single_variants = "allow"
wildcard_imports = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
semicolon_if_nothing_returned = "allow"
if_not_else = "allow"
explicit_iter_loop = "allow"
manual_let_else = "allow"

[[example]]
name = "with_ta"
required-features = ["ta"]
